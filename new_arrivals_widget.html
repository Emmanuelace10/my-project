<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .num-tabular { font-variant-numeric: tabular-nums lining-nums; }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0 font-sans">
  <div class="py-2 space-y-3">
    <!-- Header bar -->
    <div class="flex items-center justify-between gap-3 pb-2.5 border-b border-[var(--card-border)]">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 text-[10px] font-bold tracking-wider uppercase border border-emerald-500/30">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          28 New Drops Uploaded
        </span>
        <span class="text-xs font-semibold text-[var(--muted-foreground)] hidden sm:inline">Dubem Luxury Flagship • Owerri</span>
      </div>
      <div class="flex items-center gap-2">
        <a href="https://wa.me/2349166017127" target="_blank" class="px-2.5 py-1 rounded-lg bg-[#25D366]/20 hover:bg-[#25D366]/30 text-emerald-400 border border-[#25D366]/40 text-xs font-semibold flex items-center gap-1 transition-all">
          <span>WhatsApp Concierge</span>
        </a>
      </div>
    </div>

    <!-- Category Filter Pills -->
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5" id="filterBar">
      <button onclick="filterCategory('all')" id="btn-all" class="cat-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-[var(--primary)] text-[var(--primary-foreground)]">All 28 Drops</button>
      <button onclick="filterCategory('denim')" id="btn-denim" class="cat-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--border)]">Denim &amp; Jorts (13)</button>
      <button onclick="filterCategory('tops')" id="btn-tops" class="cat-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--border)]">Tops &amp; Shirts (11)</button>
      <button onclick="filterCategory('shorts')" id="btn-shorts" class="cat-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--border)]">Tech Shorts (4)</button>
    </div>

    <!-- Horizontal Scroll Carousel -->
    <div id="productCarousel" class="flex gap-3 overflow-x-auto no-scrollbar py-1 scroll-smooth">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <script>
    const items = [
      { id: "drop_new_01.jpg", title: "Sports 88 Retro Striped Polo", cat: "tops", price: "₦35,000", tag: "Retro Knit" },
      { id: "drop_new_02.jpg", title: "Arena O2 Matchday Jersey", cat: "tops", price: "₦38,000", tag: "Pitch Jersey" },
      { id: "drop_new_03.jpg", title: "Belotti Studded Denim Jorts", cat: "denim", price: "₦35,000", tag: "Distressed" },
      { id: "drop_new_04.jpg", title: "Galeno Washed Carpenter Jeans", cat: "denim", price: "₦42,000", tag: "14oz Denim" },
      { id: "drop_new_05.jpg", title: "Scalvini Raw-Hem Straight Denim", cat: "denim", price: "₦45,000", tag: "Atelier" },
      { id: "drop_new_06.jpg", title: "Scalvini Splatter Paint Jeans", cat: "denim", price: "₦45,000", tag: "Artisan" },
      { id: "drop_new_07.jpg", title: "Brasil #9 R9 Long-Sleeve Polo", cat: "tops", price: "₦38,000", tag: "Iconic Polo" },
      { id: "drop_new_08.jpg", title: "HC 4020 Pleated Denim Jorts", cat: "denim", price: "₦35,000", tag: "Tailored" },
      { id: "drop_new_09.jpg", title: "CJ Studio Frayed Black Denim Shirt", cat: "tops", price: "₦42,000", tag: "Overshirt" },
      { id: "drop_new_10.jpg", title: "YYDS Multi-Button Fly Jorts", cat: "denim", price: "₦35,000", tag: "5-Button" },
      { id: "drop_new_11.jpg", title: "JY 443 Botanical Sketch Jorts", cat: "denim", price: "₦35,000", tag: "Acid Wash" },
      { id: "drop_new_12.jpg", title: "CJ Studio Indigo Camo-Fray Shirt", cat: "tops", price: "₦42,000", tag: "Overshirt" },
      { id: "drop_new_13.jpg", title: "Adidas 3-Stripe Wide Track Pants", cat: "denim", price: "₦38,000", tag: "Tricot" },
      { id: "drop_new_14.jpg", title: "GMC Palm Tree Resort Cuban Shirt", cat: "tops", price: "₦36,000", tag: "Resort Silk" },
      { id: "drop_new_15.jpg", title: "XTD 1102H Flared Wide Jorts", cat: "denim", price: "₦35,000", tag: "Wide A-Line" },
      { id: "drop_new_16.jpg", title: "Orchid Embroidered Gingham Shirt", cat: "tops", price: "₦38,000", tag: "Micro-Check" },
      { id: "drop_new_17.jpg", title: "Filigree Vine Embroidered Shirt", cat: "tops", price: "₦38,000", tag: "Cuban Collar" },
      { id: "drop_new_18.jpg", title: "9827# Luxury Minimalist Polo", cat: "tops", price: "₦35,000", tag: "4 Palette" },
      { id: "drop_new_19.jpg", title: "CO'SPARD Tactical Camo Shirt", cat: "tops", price: "₦40,000", tag: "Military Twill" },
      { id: "drop_new_20.jpg", title: "Zara Studded Suede Harrington", cat: "tops", price: "₦45,000", tag: "Suede Jacket" },
      { id: "drop_new_21.jpg", title: "LV Maison Lambskin Trucker", cat: "tops", price: "₦45,000", tag: "Lambskin Luxe" },
      { id: "drop_new_22.jpg", title: "Ka Meng Striped Knit Pullover", cat: "tops", price: "₦38,000", tag: "Waffle Knit" },
      { id: "drop_new_23.jpg", title: "L-CFKY Multi-Pocket Cargo Shorts", cat: "denim", price: "₦35,000", tag: "Heavy Cotton" },
      { id: "drop_new_24.jpg", title: "Stüssy Breton Striped Henley", cat: "tops", price: "₦38,000", tag: "Skater Knit" },
      { id: "drop_new_25.jpg", title: "Pastel Canary Tech Swim Shorts", cat: "shorts", price: "₦25,000", tag: "Tech Nylon" },
      { id: "drop_new_26.jpg", title: "Mint Turquoise Tech Swim Shorts", cat: "shorts", price: "₦25,000", tag: "Tech Nylon" },
      { id: "drop_new_27.jpg", title: "Noir Bungee Cinch Tech Shorts", cat: "shorts", price: "₦25,000", tag: "Bungee Toggle" },
      { id: "drop_new_28.jpg", title: "Aqua Cyan Bungee Tech Shorts", cat: "shorts", price: "₦25,000", tag: "Bungee Toggle" }
    ];

    let currentCat = 'all';

    function renderCards() {
      const carousel = document.getElementById('productCarousel');
      const filtered = currentCat === 'all' ? items : items.filter(x => x.cat === currentCat);

      carousel.innerHTML = filtered.map(item => `
        <div class="flex-none w-[170px] sm:w-[190px] bg-[var(--card)] border border-[var(--border)] hover:border-[var(--accent)] rounded-2xl p-2.5 transition-all duration-200 flex flex-col justify-between">
          <div class="relative overflow-hidden rounded-xl aspect-[4/5] mb-2 bg-[var(--background)]">
            <img src="assets/images/${item.id}" onerror="this.onerror=null; this.src='${item.id}'" alt="${item.title}" class="w-full h-full object-cover rounded-xl" loading="lazy">
            <span class="absolute top-1.5 left-1.5 px-2 py-0.5 rounded-md bg-black/75 backdrop-blur-md text-[9px] font-bold text-amber-300 border border-amber-400/20">${item.tag}</span>
          </div>
          <div>
            <div class="text-xs font-semibold text-[var(--foreground)] truncate" title="${item.title}">${item.title}</div>
            <div class="flex items-center justify-between mt-1 pt-1.5 border-t border-[var(--border)]">
              <span class="text-xs font-bold text-amber-400 num-tabular">${item.price}</span>
              <a href="https://wa.me/2349166017127?text=Hello%20Dubem%20Boutique,%20I%20would%20like%20to%20order%20the%20${encodeURIComponent(item.title)}%20(${encodeURIComponent(item.price)})" target="_blank" class="px-2 py-0.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)] text-[10px] font-bold uppercase hover:opacity-90 transition-opacity">
                Acquire
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      currentCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = 'cat-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--border)]';
      });
      document.getElementById('btn-' + cat).className = 'cat-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-[var(--primary)] text-[var(--primary-foreground)]';
      renderCards();
    }

    renderCards();
  </script>
</body>
</html>
